<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- 앱 배경(--ui-background: --gray-50)과 일치시킨다 -->
    <meta
      name="theme-color"
      content="#fafafa"
    />
    <meta
      name="description"
      content="전역 이후의 자산 목표를 제대로 준비하는 AI 금융 서비스"
    />

    <!-- PWA / iOS 홈 화면 -->
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <!--
      default를 쓴다. black-translucent는 웹뷰를 노치 아래까지 확장하는데,
      hideHeader 라우트 8개가 safe-area-inset을 쓰지 않는 자체 헤더를
      그리고 있어서 그 화면들의 내용이 노치에 가린다.
    -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="제대로"
    />
    <link
      rel="apple-touch-icon"
      href="/icons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      href="/icons/favicon-64.png"
    />

    <title>제대로 | 전역 후 자산관리</title>
  </head>
  <body>
    <div id="app"></div>
    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>
